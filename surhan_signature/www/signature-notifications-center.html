<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signature Notifications Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #edf5ff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,0.22), transparent 30%),
        radial-gradient(circle at top right, rgba(16,185,129,0.15), transparent 30%),
        linear-gradient(135deg, #07111f, #111827);
    }

    .wrap {
      width: min(1250px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 52px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: -0.04em;
    }

    p { color: #9fb0c6; line-height: 1.65; }

    .toolbar {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin:18px 0;
    }

    button, a.btn {
      border:1px solid rgba(255,255,255,0.16);
      background:rgba(255,255,255,0.10);
      color:#edf5ff;
      padding:10px 13px;
      border-radius:14px;
      text-decoration:none;
      font-weight:800;
      cursor:pointer;
    }

    button:hover, a.btn:hover { background:rgba(255,255,255,0.16); }

    .cards {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:14px;
      margin:18px 0;
    }

    .card, .panel {
      border:1px solid rgba(255,255,255,0.16);
      background:rgba(255,255,255,0.08);
      border-radius:22px;
      padding:16px;
      box-shadow:0 20px 60px rgba(0,0,0,0.28);
      backdrop-filter:blur(18px);
      overflow:auto;
      margin-top:16px;
    }

    .num {
      font-size:32px;
      font-weight:900;
      letter-spacing:-0.04em;
    }

    .muted { color:#9fb0c6; font-size:13px; }

    .raw {
      white-space:pre-wrap;
      word-break:break-word;
      overflow:auto;
      max-height:420px;
      background:rgba(0,0,0,0.30);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:16px;
      padding:14px;
      font-family:ui-monospace, Menlo, Consolas, monospace;
      font-size:12px;
      color:#d8e7ff;
      margin-top:12px;
    }

    .ok { color:#35d399; }
    .warn { color:#ffd166; }

    @media (max-width: 900px) {
      .cards { grid-template-columns:1fr 1fr; }
    }

    @media (max-width: 560px) {
      .cards { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Signature Notifications Center</h1>
    <p>Automatic ToDo synchronization and closure for internal signature requests.</p>

    <div class="toolbar">
      <button onclick="loadData()">Refresh</button>
      <button onclick="runNow()">Run Notifications Now</button>
      <button onclick="exportSnapshot()">Export Snapshot</button>
      <a class="btn" href="/signature-inbox" target="_blank">Signature Inbox</a>
      <a class="btn" href="/app/todo" target="_blank">ToDo List</a>
      <a class="btn" href="/signature-operations-center" target="_blank">Operations Center</a>
      <a class="btn" href="/signature-delegation-center" target="_blank">Delegation Center</a>
      <a class="btn" href="/signature-access-matrix" target="_blank">Access Matrix</a>
      <a class="btn" href="/signature-api-security-matrix" target="_blank">API Security Matrix</a>
      <a class="btn" href="/signature-system-integrity-center" target="_blank">System Integrity</a>
      <a class="btn" href="/signature-admin-audit" target="_blank">Admin Audit</a>
    </div>

    <div id="cards" class="cards"></div>

    <div class="panel">
      <h3>Notification Status</h3>
      <div id="output" class="raw">Loading...</div>
    </div>
  </div>

  <script>
    let CSRF_TOKEN = "{{ csrf_token or '' }}";

    function esc(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function log(value) {
      document.getElementById("output").textContent =
        typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    async function ensureCSRF() {
      if (CSRF_TOKEN && CSRF_TOKEN.length > 10) return CSRF_TOKEN;

      try {
        const res = await fetch("/api/method/surhan_signature.api.phase26a_get_csrf_token", {
          method: "GET",
          credentials: "same-origin",
          headers: { "Accept": "application/json", "X-Requested-With": "XMLHttpRequest" }
        });
        const data = await res.json();
        const msg = data.message || data;
        if (msg && msg.csrf_token) CSRF_TOKEN = msg.csrf_token;
      } catch (e) {}

      return CSRF_TOKEN;
    }

    async function api(method, args) {
      await ensureCSRF();

      const res = await fetch("/api/method/" + method, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json",
          "X-Requested-With": "XMLHttpRequest",
          "X-Frappe-CSRF-Token": CSRF_TOKEN || ""
        },
        body: JSON.stringify(args || {})
      });

      const data = await res.json();
      if (data.exc) throw new Error(data.exc);
      return data.message || data;
    }

    function renderCards(data) {
      const t = data.todo_counts || {};
      const r = data.request_counts || {};

      document.getElementById("cards").innerHTML = `
        <div class="card"><div class="muted">Pending Requests</div><div class="num warn">${esc(r.pending_requests || 0)}</div></div>
        <div class="card"><div class="muted">Open Signature ToDos</div><div class="num warn">${esc(t.open_signature_todos || 0)}</div></div>
        <div class="card"><div class="muted">Closed Signature ToDos</div><div class="num ok">${esc(t.closed_signature_todos || 0)}</div></div>
        <div class="card"><div class="muted">Total Signature ToDos</div><div class="num">${esc(t.total_signature_todos || 0)}</div></div>
      `;
    }

    async function loadData() {
      try {
        const data = await api("surhan_signature.api.phase27h_notifications_center_data");
        renderCards(data);
        log(data);
      } catch (e) {
        log(String(e));
      }
    }

    async function runNow() {
      try {
        const data = await api("surhan_signature.api.phase27h_run_notifications_now");
        log(data);
        await loadData();
      } catch (e) {
        log(String(e));
      }
    }

    async function exportSnapshot() {
      try {
        const data = await api("surhan_signature.api.phase27h_export_notifications_snapshot_json");
        log(data);
      } catch (e) {
        log(String(e));
      }
    }

    loadData();
  </script>
</body>
</html>
