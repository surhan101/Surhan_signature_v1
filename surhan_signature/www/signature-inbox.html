<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signature Inbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: #edf5ff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,0.22), transparent 30%),
        radial-gradient(circle at top right, rgba(16,185,129,0.15), transparent 30%),
        linear-gradient(135deg, #07111f, #111827);
    }

    .wrap {
      width: min(1250px, calc(100% - 32px));
      margin: 0 auto;
      padding: 34px 0 52px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: -0.04em;
    }

    p { color: #9fb0c6; line-height: 1.65; }

    .toolbar {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin:18px 0;
    }

    button, a.btn {
      border:1px solid rgba(255,255,255,0.16);
      background:rgba(255,255,255,0.10);
      color:#edf5ff;
      padding:10px 13px;
      border-radius:14px;
      text-decoration:none;
      font-weight:800;
      cursor:pointer;
    }

    button:hover, a.btn:hover { background:rgba(255,255,255,0.16); }

    .cards {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      margin:18px 0;
    }

    .card, .panel {
      border:1px solid rgba(255,255,255,0.16);
      background:rgba(255,255,255,0.08);
      border-radius:22px;
      padding:16px;
      box-shadow:0 20px 60px rgba(0,0,0,0.28);
      backdrop-filter:blur(18px);
      overflow:auto;
      margin-top:16px;
    }

    .num {
      font-size:32px;
      font-weight:900;
      letter-spacing:-0.04em;
    }

    .muted { color:#9fb0c6; font-size:13px; }

    table {
      width:100%;
      border-collapse:collapse;
      min-width:840px;
    }

    th, td {
      padding:10px 8px;
      border-bottom:1px solid rgba(255,255,255,0.10);
      vertical-align:top;
      font-size:12px;
      text-align:left;
    }

    th { color:#9fb0c6; font-weight:900; }
    td { color:#edf5ff; }

    .badge {
      display:inline-flex;
      border-radius:999px;
      padding:4px 8px;
      border:1px solid rgba(255,255,255,0.20);
      font-size:11px;
      font-weight:900;
      margin:2px;
      white-space:nowrap;
    }

    .ok { color:#35d399; border-color:rgba(53,211,153,0.45); }
    .warn { color:#ffd166; border-color:rgba(255,209,102,0.45); }
    .bad { color:#ff6b6b; border-color:rgba(255,107,107,0.45); }

    .raw {
      white-space:pre-wrap;
      word-break:break-word;
      overflow:auto;
      max-height:260px;
      background:rgba(0,0,0,0.30);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:16px;
      padding:14px;
      font-family:ui-monospace, Menlo, Consolas, monospace;
      font-size:12px;
      color:#d8e7ff;
      margin-top:12px;
    }

    @media (max-width: 800px) {
      .cards { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Signature Inbox</h1>
    <p>Your pending and recent internal signature requests.</p>

    <div class="toolbar">
      <button onclick="loadData()">Refresh</button>
      <button onclick="syncTodos()">Sync My ToDos</button>
      <button onclick="exportSnapshot()">Export Snapshot</button>
      <a class="btn" href="/signature-dashboard" target="_blank">Signature Dashboard</a>
      <a class="btn" href="/signature-operations-center" target="_blank">Operations Center</a>
      <a class="btn" href="/signature-notifications-center" target="_blank">Notifications Center</a>
      <a class="btn" href="/signature-delegation-center" target="_blank">Delegation Center</a>
      <a class="btn" href="/signature-access-matrix" target="_blank">Access Matrix</a>
      <a class="btn" href="/signature-api-security-matrix" target="_blank">API Security Matrix</a>
      <a class="btn" href="/app/todo" target="_blank">ERPNext ToDo</a>
    </div>

    <div id="cards" class="cards"></div>

    <div class="panel">
      <h3>Pending Signature Requests</h3>
      <div id="pending">Loading...</div>
    </div>

    <div class="panel">
      <h3>Recent Signature Requests</h3>
      <div id="recent">Loading...</div>
    </div>

    <div class="panel">
      <h3>Output</h3>
      <div id="output" class="raw">Ready.</div>
    </div>
  </div>

  <script>
    let CSRF_TOKEN = "{{ csrf_token or '' }}";

    function esc(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function log(value) {
      document.getElementById("output").textContent =
        typeof value === "string" ? value : JSON.stringify(value, null, 2);
    }

    async function ensureCSRF() {
      if (CSRF_TOKEN && CSRF_TOKEN.length > 10) return CSRF_TOKEN;

      try {
        const res = await fetch("/api/method/surhan_signature.api.phase26a_get_csrf_token", {
          method: "GET",
          credentials: "same-origin",
          headers: { "Accept": "application/json", "X-Requested-With": "XMLHttpRequest" }
        });
        const data = await res.json();
        const msg = data.message || data;
        if (msg && msg.csrf_token) CSRF_TOKEN = msg.csrf_token;
      } catch (e) {}

      return CSRF_TOKEN;
    }

    async function api(method, args) {
      await ensureCSRF();

      const res = await fetch("/api/method/" + method, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json",
          "X-Requested-With": "XMLHttpRequest",
          "X-Frappe-CSRF-Token": CSRF_TOKEN || ""
        },
        body: JSON.stringify(args || {})
      });

      const data = await res.json();
      if (data.exc) throw new Error(data.exc);
      return data.message || data;
    }

    function badge(status) {
      const s = String(status || "Blank");
      const cls = ["Signed", "Completed"].includes(s) ? "ok"
        : ["Pending", "Waiting", "In Progress"].includes(s) ? "warn"
        : "bad";
      return `<span class="badge ${cls}">${esc(s)}</span>`;
    }

    function renderCards(data) {
      document.getElementById("cards").innerHTML = `
        <div class="card"><div class="muted">User</div><div class="num" style="font-size:20px">${esc(data.user || "")}</div></div>
        <div class="card"><div class="muted">Pending</div><div class="num warn">${esc(data.pending_count || 0)}</div></div>
        <div class="card"><div class="muted">Total Recent</div><div class="num">${esc(data.total_count || 0)}</div></div>
      `;
    }

    function renderTable(target, rows, emptyText) {
      if (!rows || !rows.length) {
        document.getElementById(target).innerHTML = `<p>${esc(emptyText || "No records.")}</p>`;
        return;
      }

      document.getElementById(target).innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Request</th>
              <th>Status</th>
              <th>Document</th>
              <th>Signer</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td><a href="/app/document-signature-request/${esc(r.name)}" target="_blank">${esc(r.name)}</a></td>
                <td>${badge(r.status)}</td>
                <td>
                  ${esc(r.reference_doctype || "")}<br>
                  <a href="${esc(r.document_url || "#")}" target="_blank">${esc(r.reference_name || "")}</a>
                </td>
                <td>${esc(r.signer || r.full_name || "")}</td>
                <td><a class="btn" href="${esc(r.action_url || "#")}" target="_blank">Open Signature</a></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    async function loadData() {
      try {
        const data = await api("surhan_signature.api.phase27g_signature_inbox_data", { limit: 100 });
        renderCards(data);
        renderTable("pending", data.pending || [], "No pending signature requests.");
        renderTable("recent", data.recent || [], "No recent signature requests.");
        log(data);
      } catch (e) {
        log(String(e));
      }
    }

    async function syncTodos() {
      try {
        const data = await api("surhan_signature.api.phase27g_sync_signature_todos", { scope: "me", limit: 100 });
        log(data);
        await loadData();
      } catch (e) {
        log(String(e));
      }
    }

    async function exportSnapshot() {
      try {
        const data = await api("surhan_signature.api.phase27g_export_signature_inbox_snapshot_json");
        log(data);
      } catch (e) {
        log(String(e));
      }
    }

    loadData();
  </script>
</body>
</html>
