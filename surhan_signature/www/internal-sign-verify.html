<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Internal Signature Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,0.22), transparent 32%),
        radial-gradient(circle at top right, rgba(16,185,129,0.18), transparent 32%),
        linear-gradient(135deg, #07111f, #111827);
      color: #edf5ff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .wrap {
      width: min(860px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0;
    }

    .card {
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(18px);
      border-radius: 26px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.34);
    }

    h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -0.04em; }
    p { color: #9fb0c6; line-height: 1.6; }

    .valid {
      color: #35d399;
      font-weight: 900;
      font-size: 22px;
    }

    .invalid {
      color: #ff6b6b;
      font-weight: 900;
      font-size: 22px;
    }

    .meta {
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      padding: 10px 0;
    }

    .key { color: #9fb0c6; }
    .value { word-break: break-word; overflow-wrap: anywhere; font-family: ui-monospace, Menlo, Consolas, monospace; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    a, button {
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.10);
      color: #edf5ff;
      padding: 11px 13px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 800;
      cursor: pointer;
    }

    .raw {
      margin-top: 18px;
      background: rgba(0,0,0,0.30);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 14px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      overflow: auto;
      max-height: 360px;
    }

    @media (max-width: 700px) {
      .meta { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Internal Signature Verification</h1>
      <p>Verify the authenticity of an internally signed document generated by Surhan Signature.</p>

      <div id="result">Loading verification result...</div>
      <div id="raw" class="raw"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const CODE = params.get("code");

    function esc(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function load() {
      if (!CODE) {
        document.getElementById("result").innerHTML = "<div class='invalid'>Missing verification code.</div>";
        return;
      }

      try {
        const res = await fetch("/api/method/surhan_signature.api.verify_internal_signature_certificate?verification_code=" + encodeURIComponent(CODE), {
          method: "GET",
          credentials: "same-origin",
          headers: { "Accept": "application/json" }
        });

        const data = await res.json();
        const msg = data.message || data;

        document.getElementById("result").innerHTML = `
          <div class="${msg.valid ? "valid" : "invalid"}">${msg.valid ? "VALID SIGNED DOCUMENT" : "INVALID / NOT VERIFIED"}</div>

          <div class="meta"><div class="key">Verification Code</div><div class="value">${esc(msg.verification_code || CODE)}</div></div>
          <div class="meta"><div class="key">Document</div><div class="value">${esc(msg.reference_doctype || "")} / ${esc(msg.reference_name || "")}</div></div>
          <div class="meta"><div class="key">Title</div><div class="value">${esc(msg.document_title || "")}</div></div>
          <div class="meta"><div class="key">Certificate Status</div><div class="value">${esc(msg.certificate_status || "")}</div></div>
          <div class="meta"><div class="key">Complete</div><div class="value">${esc(msg.complete)}</div></div>
          <div class="meta"><div class="key">PDF SHA256 Match</div><div class="value">${esc(msg.signed_pdf_sha256_matches)}</div></div>
          <div class="meta"><div class="key">Print Hash</div><div class="value">${esc(msg.print_hash || "")}</div></div>
          <div class="meta"><div class="key">Generated At</div><div class="value">${esc(msg.generated_at || "")}</div></div>

          <div class="actions">
            ${msg.signed_pdf ? `<a href="${esc(msg.signed_pdf)}" target="_blank">Open Signed PDF</a>` : ""}
          </div>
        `;

        document.getElementById("raw").textContent = JSON.stringify(msg, null, 2);
      } catch (e) {
        document.getElementById("result").innerHTML = "<div class='invalid'>" + esc(String(e)) + "</div>";
      }
    }

    load();
  </script>
</body>
</html>
